# Keeps the actions pinned by commit and the Go modules up to date: once a week, one pull request for each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      modules:
        patterns: ["*"]
